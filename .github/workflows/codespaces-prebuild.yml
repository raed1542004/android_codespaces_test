name: Codespaces Prebuild

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Codespaces Prebuild
        uses: github/codespaces-prebuild@v1
        with:
          repo: ${{ github.repository }}
          ref: ${{ github.ref }}
          machine-type: "standardLinux32gb"
