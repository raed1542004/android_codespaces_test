plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.helloandroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.helloandroid"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // ===== AndroidX Core (أساسي) =====
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.fragment:fragment:1.6.2'

    // ===== Material Design (3.1: Material Design) =====
    implementation 'com.google.android.material:material:1.11.0'

    // ===== Lifecycle (لـ Fragments و Services) =====
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // ===== Navigation (2.2: User Navigation) =====
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // ===== RecyclerView (لـ Menus و Lists) =====
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ===== Services & Broadcasts (4.3, 4.4) =====
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // ===== Notifications (5.1) =====
    implementation 'androidx.core:core-ktx:1.12.0'

    // ===== Firebase (6.1) - تفعيل عند الحاجة =====
    // أضف google-services.json أولاً ثم فعّل:
    // implementation platform('com.google.firebase:firebase-bom:32.7.0')
    // implementation 'com.google.firebase:firebase-auth'
    // implementation 'com.google.firebase:firebase-database'
    // implementation 'com.google.firebase:firebase-messaging'

    // ===== AsyncTask / AsyncTaskLoader (4.1) =====
    // (مدمج في AndroidX Core - لا حاجة لاعتماد إضافي)

    // ===== Internet (4.2) =====
    // implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
}
